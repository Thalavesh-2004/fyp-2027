experiment:
  id: exp_drop_20
  name: Drop Computation Attack (20%)
  duration_seconds: 60
  records: 10000
  random_seed: 42
  worker_count: 3

stream:
  kafka_topic: sensor-stream
  bootstrap_servers: localhost:29092
  spark_master: local[*]
  trigger_interval_ms: 1000

producer:
  events_per_second: 500
  total_events: 10000
  sensor_count: 5
  random_seed: 42

attack:
  enabled: true
  type: DROP_COMPUTATION
  probability: 0.20
  target_workers: []
  drop:
    probability: 0.20
